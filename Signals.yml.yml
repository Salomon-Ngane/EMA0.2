name: Signal Bot

on:
  schedule:
    # Toutes les 30 minutes (ajuste selon SIGNAL_TIMEFRAME dans signal_bot.py)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet Actions

# Necessaire pour que le job puisse recommitter state.json
permissions:
  contents: write

jobs:
  run-signal-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer le bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_bot.py

      - name: Sauvegarder l'etat (anti-doublon) dans le repo
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update signal state [skip ci]"
          git push
